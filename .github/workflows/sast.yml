name: sast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  polyml-load-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Poly/ML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends polyml
      - name: Load runtime
        run: poly --script src/stakeholder.sml --list-values >/dev/null
